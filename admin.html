<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyAi_NnPfUwHPVQcmHMm9vKIYjbJWuzBqms",
        authDomain: "al-waleed-menu.firebaseapp.com",
        projectId: "al-waleed-menu",
        storageBucket: "al-waleed-menu.firebasestorage.app",
        messagingSenderId: "93044767292",
        appId: "1:93044767292:web:5f34dd396dd50c82bf6139"
    };

    // ✅ إعدادات Cloudinary
    const CLOUD_NAME = 'lxjejnqwn';
    const UPLOAD_PRESET = 'alwaleed_menu';

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "admin@alwaleed.com";

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginMessage = document.getElementById('login-message');
    const adminMessage = document.getElementById('admin-message');
    const itemsList = document.getElementById('items-list');
    let editingItemId = null;
    let uploadedImageBlob = null;
    let uploadedImageUrl = null;

    function showMessage(element, text, type) {
        element.textContent = text;
        element.className = 'message ' + type;
        setTimeout(() => { element.className = 'message'; }, 4000);
    }

    window.switchTab = function(tabName, btnElement) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        btnElement.classList.add('active');
    }

    window.login = async function() {
        const password = document.getElementById('password').value;
        if (!password) { showMessage(loginMessage, 'الرجاء إدخال كلمة السر', 'error'); return; }
        try {
            await signInWithEmailAndPassword(auth, ADMIN_EMAIL, password);
        } catch (error) {
            showMessage(loginMessage, 'كلمة السر غير صحيحة', 'error');
        }
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') window.login();
    });

    window.logout = function() { signOut(auth); }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            loadItems();
            loadSettingsForEdit();
        } else {
            loginSection.style.display = 'block';
            dashboardSection.style.display = 'none';
            document.getElementById('password').value = '';
        }
    });

    // ✅ دالة رفع الصورة: نحولها Blob بدل Base64
    window.handleImageUpload = function(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                let width = img.width; let height = img.height;
                if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
                else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                canvas.toBlob(function(blob) {
                    uploadedImageBlob = blob;
                    uploadedImageUrl = null;
                    document.getElementById('preview-img').src = URL.createObjectURL(blob);
                    document.getElementById('image-preview').style.display = 'block';
                    document.getElementById('item-image').value = '';
                }, 'image/jpeg', 0.8);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    function resetForm() {
        document.getElementById('item-category').value = '';
        document.getElementById('item-name').value = '';
        document.getElementById('item-price').value = '';
        document.getElementById('item-desc').value = '';
        document.getElementById('item-image').value = '';
        document.getElementById('item-image-file').value = '';
        document.getElementById('image-preview').style.display = 'none';
        uploadedImageBlob = null;
        uploadedImageUrl = null;
        editingItemId = null;
        document.getElementById('form-title').textContent = 'إضافة صنف جديد';
        document.getElementById('submit-btn').textContent = 'إضافة الصنف';
        document.getElementById('cancel-btn').style.display = 'none';
    }

    window.cancelEdit = function() { resetForm(); showMessage(adminMessage, 'تم إلغاء التعديل', 'success'); }

    async function loadItems() {
        itemsList.innerHTML = '<p style="text-align:center;">جاري التحميل...</p>';
        const q = query(collection(db, "menu"), orderBy("category"));
        const querySnapshot = await getDocs(q);
        itemsList.innerHTML = '';
        if (querySnapshot.empty) { itemsList.innerHTML = '<p style="text-align:center; color: var(--text-muted);">لا توجد أصناف بعد.</p>'; return; }
        querySnapshot.forEach((docSnap) => {
            const item = docSnap.data();
            const id = docSnap.id;
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <div class="item-info">
                    <img src="${item.imageUrl || 'https://via.placeholder.com/50'}" alt="${item.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=No+Image'">
                    <div><strong>${item.name}</strong> <span style="color: var(--gold);">(${item.price} ل.س)</span><br><small style="color: var(--text-muted);">${item.category}</small></div>
                </div>
                <div class="item-actions">
                    <button class="btn-edit" onclick="editItem('${id}')">تعديل</button>
                    <button class="btn-danger" onclick="deleteItem('${id}')">حذف</button>
                </div>`;
            itemsList.appendChild(row);
        });
    }

    window.editItem = async function(id) {
        try {
            const docSnap = await getDoc(doc(db, "menu", id));
            if (docSnap.exists()) {
                const item = docSnap.data();
                document.getElementById('item-category').value = item.category || '';
                document.getElementById('item-name').value = item.name || '';
                document.getElementById('item-price').value = item.price || '';
                document.getElementById('item-desc').value = item.description || '';
                if (item.imageUrl && item.imageUrl.startsWith('http')) {
                    document.getElementById('item-image').value = item.imageUrl;
                    document.getElementById('preview-img').src = item.imageUrl;
                    document.getElementById('image-preview').style.display = 'block';
                } else {
                    document.getElementById('item-image').value = '';
                }
                uploadedImageBlob = null;
                uploadedImageUrl = null;
                editingItemId = id;
                document.getElementById('form-title').textContent = 'تعديل: ' + item.name;
                document.getElementById('submit-btn').textContent = 'حفظ التعديلات';
                document.getElementById('cancel-btn').style.display = 'block';
                document.querySelectorAll('.tab-btn')[0].click();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        } catch (error) { console.error(error); }
    }

    // ✅ دالة رفع الصورة على Cloudinary
    async function uploadToCloudinary(blob) {
        const formData = new FormData();
        formData.append('file', blob);
        formData.append('upload_preset', UPLOAD_PRESET);
        const res = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
            { method: 'POST', body: formData }
        );
        const data = await res.json();
        if (!data.secure_url) throw new Error('فشل رفع الصورة');
        return data.secure_url;
    }

    window.saveItem = async function() {
        const category = document.getElementById('item-category').value;
        const name = document.getElementById('item-name').value;
        const price = document.getElementById('item-price').value;
        const description = document.getElementById('item-desc').value;
        const imageUrlInput = document.getElementById('item-image').value;

        if (!category || !name || !price) {
            showMessage(adminMessage, 'يرجى ملء الحقول الإجبارية', 'error');
            return;
        }

        let finalImage = '';

        if (uploadedImageBlob) {
            try {
                showMessage(adminMessage, '⏳ جاري رفع الصورة...', 'success');
                finalImage = await uploadToCloudinary(uploadedImageBlob);
                uploadedImageUrl = finalImage;
            } catch (err) {
                console.error(err);
                showMessage(adminMessage, '❌ فشل رفع الصورة، حاول مرة أخرى', 'error');
                return;
            }
        }
        else if (imageUrlInput && imageUrlInput.startsWith('http')) {
            finalImage = imageUrlInput;
        }
        else if (editingItemId) {
            const oldDoc = await getDoc(doc(db, "menu", editingItemId));
            finalImage = oldDoc.data().imageUrl || '';
        }

        const itemData = { category, name, price: parseInt(price), description, imageUrl: finalImage };

        try {
            if (editingItemId) {
                await updateDoc(doc(db, "menu", editingItemId), itemData);
                showMessage(adminMessage, '✅ تم تعديل الصنف!', 'success');
            } else {
                itemData.createdAt = new Date();
                await addDoc(collection(db, "menu"), itemData);
                showMessage(adminMessage, '✅ تم إضافة الصنف!', 'success');
            }
            resetForm();
            loadItems();
        } catch (error) {
            console.error(error);
            showMessage(adminMessage, '❌ حدث خطأ', 'error');
        }
    }

    window.deleteItem = async function(id) {
        if (confirm('تأكيد الحذف؟')) {
            try { await deleteDoc(doc(db, "menu", id)); showMessage(adminMessage, 'تم الحذف', 'success'); if (editingItemId === id) resetForm(); loadItems(); }
            catch (error) { showMessage(adminMessage, 'حدث خطأ', 'error'); }
        }
    }

    async function loadSettingsForEdit() {
        try {
            const docSnap = await getDoc(doc(db, "settings", "info"));
            if (docSnap.exists()) {
                const s = docSnap.data();
                document.getElementById('set-name').value = s.name || '';
                document.getElementById('set-subtitle').value = s.subtitle || '';
                document.getElementById('set-status').value = s.status || '';
                document.getElementById('set-whatsapp').value = s.whatsapp || '';
                document.getElementById('set-whatsapp-display').value = s.whatsappDisplay || '';
                document.getElementById('set-phone').value = s.phoneDisplay || '';
                document.getElementById('set-phone-call').value = s.phone || '';
                document.getElementById('set-address').value = s.address || '';
                document.getElementById('set-map').value = s.mapUrl || '';
                document.getElementById('set-delivery-note').value = s.deliveryNote || 'سعر التوصيل يحدده المطعم حسب المنطقة';
                document.getElementById('set-delivery-show').value = s.deliveryShow || 'yes';
            }
        } catch (error) { console.error(error); }
    }

    window.saveSettings = async function() {
        const settingsData = {
            name: document.getElementById('set-name').value,
            subtitle: document.getElementById('set-subtitle').value,
            status: document.getElementById('set-status').value,
            whatsapp: document.getElementById('set-whatsapp').value,
            whatsappDisplay: document.getElementById('set-whatsapp-display').value,
            phone: document.getElementById('set-phone-call').value,
            phoneDisplay: document.getElementById('set-phone').value,
            address: document.getElementById('set-address').value,
            mapUrl: document.getElementById('set-map').value,
            deliveryNote: document.getElementById('set-delivery-note').value,
            deliveryShow: document.getElementById('set-delivery-show').value
        };
        try { await setDoc(doc(db, "settings", "info"), settingsData); showMessage(adminMessage, 'تم حفظ الإعدادات! ✅', 'success'); }
        catch (error) { showMessage(adminMessage, 'حدث خطأ', 'error'); }
    }
</script>
