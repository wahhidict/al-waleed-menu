<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم الوليد | Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --card-bg: rgba(30, 30, 40, 0.6);
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-main: #ffffff;
            --text-muted: #8a8a95;
            --border-color: rgba(212, 175, 55, 0.15);
            --whatsapp: #25D366;
            --danger: #ff4757;
            --success: #2ed573;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(ellipse at top, #1a1a24 0%, #0a0a0f 60%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 100px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .hero { position: relative; height: 320px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 30px 20px 25px; }
        .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,15,0.4) 0%, rgba(10,10,15,0.85) 60%, var(--bg-primary) 100%); z-index: 1; }
        .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.65; filter: blur(1px) brightness(0.8); animation: slowZoom 20s ease-in-out infinite alternate; }
        @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.08); } }
        .hero-content { position: relative; z-index: 2; text-align: center; }
        .hero-badge { display: inline-block; background: rgba(212, 175, 55, 0.15); backdrop-filter: blur(10px); border: 1px solid var(--border-color); color: var(--gold); padding: 6px 16px; border-radius: 30px; font-size: 0.8em; font-weight: 500; letter-spacing: 1px; margin-bottom: 12px; }
        .hero h1 { font-size: 2.6em; font-weight: 900; background: linear-gradient(135deg, #f0d264 0%, #d4af37 50%, #b8941f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; letter-spacing: -1px; text-shadow: 0 4px 30px var(--gold-glow); }
        .hero-subtitle { color: var(--text-muted); font-size: 0.95em; margin-bottom: 15px; }
        .hero-status { display: inline-flex; align-items: center; gap: 8px; background: rgba(46, 213, 115, 0.15); border: 1px solid rgba(46, 213, 115, 0.3); color: var(--success); padding: 6px 16px; border-radius: 30px; font-size: 0.85em; font-weight: 500; }
        .hero-status::before { content: ''; width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); } 50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(46, 213, 115, 0); } }
        .contact-bar { display: flex; gap: 12px; padding: 20px; max-width: 700px; margin: 0 auto; }
        .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 16px; text-decoration: none; font-weight: 700; font-size: 0.95em; color: white; border: none; cursor: pointer; transition: all 0.3s; font-family: 'Tajawal', sans-serif; }
        .btn:active { transform: scale(0.97); }
        .btn-whatsapp { background: linear-gradient(135deg, #25D366, #1ea952); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3); }
        .btn-map { background: linear-gradient(135deg, #4285F4, #2c6fd6); box-shadow: 0 8px 25px rgba(66, 133, 244, 0.3); }
        .search-wrapper { padding: 0 20px 15px; max-width: 700px; margin: 0 auto; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 15px 50px 15px 20px; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 16px; color: white; font-family: 'Tajawal', sans-serif; font-size: 1em; outline: none; transition: all 0.3s; }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1); }
        .search-icon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 1.2em; }
        .filters { display: flex; gap: 10px; padding: 10px 20px 20px; overflow-x: auto; scrollbar-width: none; max-width: 700px; margin: 0 auto; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { flex-shrink: 0; padding: 10px 22px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 30px; color: var(--text-muted); font-family: 'Tajawal', sans-serif; font-size: 0.9em; font-weight: 500; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
        .filter-btn.active { background: linear-gradient(135deg, #f0d264, #d4af37); color: #0a0a0f; border-color: var(--gold); font-weight: 700; }
        .container { max-width: 700px; margin: 0 auto; padding: 0 20px; }
        .menu-section { margin-bottom: 40px; }
        .section-title { display: flex; align-items: center; gap: 12px; color: var(--gold); font-size: 1.5em; font-weight: 700; margin-bottom: 20px; }
        .section-title::before { content: ''; width: 4px; height: 28px; background: linear-gradient(180deg, #f0d264, #d4af37); border-radius: 4px; }
        .menu-card { display: flex; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden; margin-bottom: 14px; transition: all 0.4s; position: relative; cursor: pointer; }
        .menu-card:hover { transform: translateY(-4px); border-color: var(--gold); }
        .menu-card img { width: 120px; height: 120px; object-fit: cover; flex-shrink: 0; background: #1a1a24; }
        .menu-card-info { padding: 16px 18px; display: flex; flex-direction: column; justify-content: center; flex-grow: 1; }
        .menu-card-info h3 { font-size: 1.15em; font-weight: 700; margin-bottom: 5px; color: #fff; }
        .menu-card-info p { font-size: 0.85em; color: var(--text-muted); margin-bottom: 10px; }
        .item-price { color: var(--gold); font-weight: 700; font-size: 1.15em; }
        .item-price::after { content: ' ل.س'; font-size: 0.75em; opacity: 0.7; }
        .add-btn { position: absolute; bottom: 14px; left: 14px; background: linear-gradient(135deg, #f0d264, #d4af37); color: #0a0a0f; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.5em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px var(--gold-glow); }
        .add-btn:active { transform: scale(0.95); }
        .skeleton-card { display: flex; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden; margin-bottom: 14px; height: 120px; }
        .skeleton-img { width: 120px; height: 100%; background: linear-gradient(90deg, #1a1a24 25%, #252530 50%, #1a1a24 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        .skeleton-info { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
        .skeleton-line { height: 14px; background: linear-gradient(90deg, #1a1a24 25%, #252530 50%, #1a1a24 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
        .skeleton-line.w-60 { width: 60%; } .skeleton-line.w-40 { width: 40%; } .skeleton-line.w-30 { width: 30%; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        footer { text-align: center; margin-top: 60px; padding: 30px 20px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.9em; }
        footer a { color: var(--gold); text-decoration: none; }
        .cart-float { position: fixed; bottom: 20px; left: 20px; right: 20px; background: linear-gradient(135deg, #f0d264, #d4af37); color: #0a0a0f; border: none; padding: 16px 24px; border-radius: 20px; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 1.05em; cursor: pointer; display: none; justify-content: space-between; align-items: center; box-shadow: 0 10px 40px var(--gold-glow); z-index: 100; max-width: 660px; margin: 0 auto; }
        .cart-float .cart-count { background: #0a0a0f; color: var(--gold); padding: 4px 14px; border-radius: 20px; font-size: 0.9em; font-weight: 900; }
        .cart-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 200; padding: 20px; overflow-y: auto; }
        .cart-modal.active { display: block; }
        .cart-content { max-width: 600px; margin: 20px auto; background: linear-gradient(135deg, #1a1a24, #15151c); border-radius: 24px; padding: 25px; border: 1px solid var(--border-color); }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border-color); }
        .cart-header h2 { color: var(--gold); font-size: 1.5em; font-weight: 700; }
        .close-btn { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid rgba(255, 71, 87, 0.3); width: 38px; height: 38px; border-radius: 50%; font-size: 1.1em; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(42, 42, 52, 0.5); padding: 14px; border-radius: 14px; margin-bottom: 10px; }
        .cart-item-info h4 { font-size: 1em; margin-bottom: 3px; font-weight: 600; }
        .cart-item-info .cart-item-price { color: var(--gold); font-size: 0.85em; }
        .quantity-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: rgba(212, 175, 55, 0.15); color: var(--gold); border: 1px solid var(--border-color); width: 32px; height: 32px; border-radius: 50%; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        .qty-btn.remove { background: rgba(255, 71, 87, 0.15); color: var(--danger); }
        .qty-display { color: white; font-weight: 700; min-width: 25px; text-align: center; }
        .empty-cart { text-align: center; color: var(--text-muted); padding: 50px 20px; font-size: 1.1em; }
        .customer-form { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .customer-form h3 { color: var(--gold); margin-bottom: 15px; font-size: 1.1em; }
        .customer-form input, .customer-form textarea { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--border-color); background: rgba(42, 42, 52, 0.5); color: white; font-family: 'Tajawal', sans-serif; margin-bottom: 12px; outline: none; font-size: 0.95em; }
        .delivery-note { background: rgba(66, 133, 244, 0.1); border: 1px solid rgba(66, 133, 244, 0.3); color: #6da5ff; padding: 12px 16px; border-radius: 12px; margin-top: 15px; font-size: 0.9em; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 18px; border-top: 2px solid var(--border-color); font-size: 1.3em; font-weight: 700; color: var(--gold); }
        .confirm-btn { width: 100%; background: linear-gradient(135deg, #25D366, #1ea952); color: white; border: none; padding: 16px; border-radius: 16px; font-family: 'Tajawal', sans-serif; font-size: 1.05em; font-weight: 700; cursor: pointer; margin-top: 18px; }
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { background: linear-gradient(135deg, rgba(46, 213, 115, 0.95), rgba(30, 168, 90, 0.95)); color: white; padding: 14px 22px; border-radius: 16px; font-weight: 600; font-size: 0.95em; animation: toastIn 0.4s; display: flex; align-items: center; gap: 10px; }
        .toast.error { background: linear-gradient(135deg, rgba(255, 71, 87, 0.95), rgba(200, 40, 60, 0.95)); }
        @keyframes toastIn { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast.out { animation: toastOut 0.4s ease forwards; }
        @keyframes toastOut { to { transform: translateY(-30px); opacity: 0; } }
        .item-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); z-index: 250; padding: 20px; overflow-y: auto; }
        .item-modal.active { display: flex; align-items: center; justify-content: center; }
        .item-detail { max-width: 480px; width: 100%; background: linear-gradient(135deg, #1a1a24, #15151c); border-radius: 24px; overflow: hidden; border: 1px solid var(--border-color); position: relative; }
        .item-detail img { width: 100%; height: 280px; object-fit: cover; }
        .item-detail-body { padding: 24px; }
        .item-detail-body h2 { color: var(--gold); font-size: 1.6em; margin-bottom: 10px; font-weight: 700; }
        .item-detail-body .desc { color: var(--text-muted); font-size: 0.95em; margin-bottom: 20px; }
        .item-detail-body .price { color: var(--gold); font-size: 1.5em; font-weight: 900; margin-bottom: 20px; }
        .item-detail-body .price::after { content: ' ل.س'; font-size: 0.6em; opacity: 0.7; }
        .item-detail-close { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2em; cursor: pointer; z-index: 2; }
        .item-detail .add-to-cart-btn { width: 100%; background: linear-gradient(135deg, #f0d264, #d4af37); color: #0a0a0f; border: none; padding: 16px; border-radius: 14px; font-family: 'Tajawal', sans-serif; font-size: 1.05em; font-weight: 900; cursor: pointer; }
        .no-results { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .no-results .icon { font-size: 3em; margin-bottom: 10px; opacity: 0.5; }
        .loader-msg { text-align: center; color: var(--gold); padding: 50px 20px; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<div class="hero">
    <img class="hero-img" src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=1200&q=80" alt="مطعم الوليد">
    <div class="hero-content">
        <span class="hero-badge">★ تجربة طعام مميزة</span>
        <h1 id="shop-name">مطعم الوليد</h1>
        <p class="hero-subtitle" id="shop-subtitle">جاري التحميل...</p>
        <span class="hero-status" id="shop-status">مفتوح الآن • يوجد توصيل</span>
    </div>
</div>

<div class="contact-bar">
    <a href="#" id="whatsapp-btn" class="btn btn-whatsapp" target="_blank"><span>💬</span> اطلب عبر واتساب</a>
    <a href="#" id="map-btn" class="btn btn-map" target="_blank"><span>📍</span> الموقع</a>
</div>

<div class="search-wrapper">
    <div class="search-box">
        <input type="text" id="search-input" placeholder="ابحث عن طبق...">
        <span class="search-icon">🔍</span>
    </div>
</div>

<div class="filters" id="filters"></div>

<div class="container" id="menu-container">
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-info"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div><div class="skeleton-line w-30"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-info"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div><div class="skeleton-line w-30"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-info"><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div><div class="skeleton-line w-30"></div></div></div>
</div>

<footer>
    <div id="footer-address">📍 جاري التحميل...</div>
    <div style="margin-top: 8px;">📞 <a href="#" id="footer-phone">...</a></div>
    <div style="margin-top: 15px; opacity: 0.5; font-size: 0.8em;">© مطعم الوليد - جميع الحقوق محفوظة</div>
</footer>

<button class="cart-float" id="cart-float" onclick="openCart()">
    <span>🛒 عرض السلة</span>
    <span class="cart-count" id="cart-count">0</span>
</button>

<div class="cart-modal" id="cart-modal">
    <div class="cart-content">
        <div class="cart-header">
            <h2>🛒 سلة الطلبات</h2>
            <button class="close-btn" onclick="closeCart()">✕</button>
        </div>
        <div id="cart-items-container"></div>
        <div class="delivery-note" id="delivery-note-el" style="display: none;">🚚 سعر التوصيل يحدده المطعم حسب المنطقة</div>
        <div class="customer-form" id="customer-form" style="display: none;">
            <h3>📝 معلومات التوصيل</h3>
            <input type="text" id="customer-name" placeholder="الاسم الكامل *">
            <input type="tel" id="customer-phone" placeholder="رقم الهاتف *">
            <textarea id="customer-address" rows="2" placeholder="العنوان بالتفصيل *"></textarea>
        </div>
        <div class="total-row" id="total-row" style="display: none;">
            <span>الإجمالي:</span>
            <span id="cart-total">0 ل.س</span>
        </div>
        <button class="confirm-btn" id="confirm-btn" onclick="sendOrder()" style="display: none;">✅ تأكيد الطلب عبر واتساب</button>
    </div>
</div>

<div class="item-modal" id="item-modal">
    <div class="item-detail" id="item-detail-content"></div>
</div>

<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyAi_NnPfUwHPVQcmHMm9vKIYjbJWuzBqms",
        authDomain: "al-waleed-menu.firebaseapp.com",
        projectId: "al-waleed-menu",
        storageBucket: "al-waleed-menu.firebasestorage.app",
        messagingSenderId: "93044767292",
        appId: "1:93044767292:web:5f34dd396dd50c82bf6139"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const menuContainer = document.getElementById('menu-container');
    const filtersContainer = document.getElementById('filters');
    const searchInput = document.getElementById('search-input');
    const deliveryNoteEl = document.getElementById('delivery-note-el');

    let restaurantWhatsApp = "963949574237";
    let restaurantName = "مطعم الوليد";
    let cart = [];
    let allMenuItems = [];
    let currentFilter = "all";
    let deliveryNote = "سعر التوصيل يحدده المطعم حسب المنطقة";
    let deliveryShow = "yes";

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast' + (type === 'error' ? ' error' : '');
        toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> ${message}`;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 400); }, 2500);
    }

    // ✅ Real-time للإعدادات
    onSnapshot(doc(db, "settings", "info"), (docSnap) => {
        if (!docSnap.exists()) return;
        const settings = docSnap.data();
        restaurantName = settings.name || 'مطعم الوليد';
        restaurantWhatsApp = settings.whatsapp || '963949574237';
        document.getElementById('shop-name').textContent = restaurantName;
        document.getElementById('shop-subtitle').textContent = settings.subtitle || 'عدرا الصناعية - قطاع أول هندسية';
        document.getElementById('shop-status').textContent = settings.status || 'مفتوح الآن • يوجد توصيل';
        document.getElementById('whatsapp-btn').href = `https://wa.me/${restaurantWhatsApp}`;
        document.getElementById('map-btn').href = settings.mapUrl || 'https://maps.google.com/?q=عدرا+الصناعية+دمشق';
        document.getElementById('footer-address').textContent = '📍 ' + (settings.address || 'عدرا الصناعية - قطاع أول هندسية');
        const phoneLink = document.getElementById('footer-phone');
        phoneLink.textContent = settings.phoneDisplay || '011 585 3701';
        phoneLink.href = `tel:${settings.phoneCall || '+963115853701'}`;
        deliveryNote = settings.deliveryNote || 'سعر التوصيل يحدده المطعم حسب المنطقة';
        deliveryShow = settings.deliveryShow || 'yes';
    }, (error) => {
        console.error('Settings error:', error);
    });

    // ✅ Real-time للمنيو (وثيقة وحدة)
    onSnapshot(doc(db, "menu", "all"), (docSnap) => {
        if (!docSnap.exists() || !docSnap.data().items) {
            menuContainer.innerHTML = '<div class="loader-msg">المنيو قيد التحديث...</div>';
            return;
        }
        allMenuItems = docSnap.data().items || [];
        renderFilters();
        applyFilters();
    }, (error) => {
        console.error('Menu error:', error);
        menuContainer.innerHTML = '<div class="loader-msg" style="color:var(--danger);">حدث خطأ في التحميل.</div>';
    });

    function renderFilters() {
        const categories = [...new Set(allMenuItems.map(i => i.category))];
        filtersContainer.innerHTML = `<button class="filter-btn active" onclick="filterMenu('all', this)">🍽️ الكل</button>`;
        categories.forEach(cat => {
            filtersContainer.innerHTML += `<button class="filter-btn" onclick="filterMenu('${cat.replace(/'/g, "\\'")}', this)">${cat}</button>`;
        });
    }

    function renderMenu(items) {
        if (items.length === 0) {
            menuContainer.innerHTML = `<div class="no-results"><div class="icon">🔍</div><div>لا توجد نتائج</div></div>`;
            return;
        }
        let currentCategory = "";
        let htmlContent = "";
        items.forEach((item) => {
            const id = item.id;
            if (item.category !== currentCategory) {
                if (currentCategory !== "") { htmlContent += `</div></div>`; }
                currentCategory = item.category;
                htmlContent += `<div class="menu-section"><h2 class="section-title">${currentCategory}</h2><div class="menu-list">`;
            }
            htmlContent += `
                <div class="menu-card">
                    <img src="${item.imageUrl || 'https://via.placeholder.com/120'}" alt="${item.name}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/120/1a1a24/d4af37?text=No+Image'">
                    <div class="menu-card-info" onclick='showItemDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                        <h3>${item.name}</h3>
                        <p>${item.description || ''}</p>
                        <div class="item-price">${item.price}</div>
                    </div>
                    <button class="add-btn" onclick='event.stopPropagation(); addToCart(${JSON.stringify({id: id, name: item.name, price: item.price}).replace(/'/g, "&apos;")})' title="أضف للسلة">+</button>
                </div>`;
        });
        if (currentCategory !== "") { htmlContent += `</div></div>`; }
        menuContainer.innerHTML = htmlContent;
    }

    window.filterMenu = function(category, btn) {
        currentFilter = category;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilters();
    };

    searchInput.addEventListener('input', applyFilters);

    // ✅ الدالة المعدلة: ترتيب حسب القسم
    function applyFilters() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        let filtered = [...allMenuItems];
        if (currentFilter !== 'all') { filtered = filtered.filter(i => i.category === currentFilter); }
        if (searchTerm) {
            filtered = filtered.filter(i => i.name.toLowerCase().includes(searchTerm) || (i.description && i.description.toLowerCase().includes(searchTerm)));
        }
        // ✅ ترتيب حسب القسم (عربي)
        filtered.sort((a, b) => (a.category || '').localeCompare(b.category || '', 'ar'));
        renderMenu(filtered);
    }

    window.showItemDetail = function(item) {
        const modal = document.getElementById('item-modal');
        const content = document.getElementById('item-detail-content');
        content.innerHTML = `
            <button class="item-detail-close" onclick="closeItemDetail()">✕</button>
            <img src="${item.imageUrl || 'https://via.placeholder.com/480'}" alt="${item.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/480/1a1a24/d4af37?text=No+Image'">
            <div class="item-detail-body">
                <h2>${item.name}</h2>
                <p class="desc">${item.description || 'طبق مميز من مطبخنا'}</p>
                <div class="price">${item.price}</div>
                <button class="add-to-cart-btn" onclick='addToCart(${JSON.stringify({id: item.id, name: item.name, price: item.price}).replace(/'/g, "&apos;")}); closeItemDetail();'>+ أضف إلى السلة</button>
            </div>
        `;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeItemDetail = function() {
        document.getElementById('item-modal').classList.remove('active');
        document.body.style.overflow = 'auto';
    };

    window.addToCart = function(item) {
        const existing = cart.find(i => i.id === item.id);
        if (existing) { existing.quantity++; }
        else { cart.push({ ...item, quantity: 1 }); }
        updateCartUI();
        showToast(`تمت إضافة "${item.name}"`);
    };

    function updateCartUI() {
        const totalItems = cart.reduce((sum, i) => sum + i.quantity, 0);
        const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
        document.getElementById('cart-count').textContent = totalItems;
        document.getElementById('cart-float').style.display = totalItems > 0 ? 'flex' : 'none';
        document.getElementById('cart-total').textContent = totalPrice.toLocaleString() + ' ل.س';
    }

    window.openCart = function() {
        renderCartItems();
        document.getElementById('cart-modal').classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeCart = function() {
        document.getElementById('cart-modal').classList.remove('active');
        document.body.style.overflow = 'auto';
    };

    function renderCartItems() {
        const container = document.getElementById('cart-items-container');
        if (cart.length === 0) {
            container.innerHTML = '<div class="empty-cart">🛒 السلة فارغة</div>';
            deliveryNoteEl.style.display = 'none';
            document.getElementById('customer-form').style.display = 'none';
            document.getElementById('total-row').style.display = 'none';
            document.getElementById('confirm-btn').style.display = 'none';
            return;
        }
        container.innerHTML = '';
        cart.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div class="cart-item-info">
                    <h4>${item.name}</h4>
                    <div class="cart-item-price">${item.price.toLocaleString()} × ${item.quantity} = ${(item.price * item.quantity).toLocaleString()} ل.س</div>
                </div>
                <div class="quantity-controls">
                    <button class="qty-btn remove" onclick="decreaseQty('${item.id}')">−</button>
                    <span class="qty-display">${item.quantity}</span>
                    <button class="qty-btn" onclick="increaseQty('${item.id}')">+</button>
                </div>`;
            container.appendChild(div);
        });
        if (deliveryShow === 'yes' && deliveryNote.trim() !== '') {
            deliveryNoteEl.textContent = '🚚 ' + deliveryNote;
            deliveryNoteEl.style.display = 'flex';
        } else {
            deliveryNoteEl.style.display = 'none';
        }
        document.getElementById('customer-form').style.display = 'block';
        document.getElementById('total-row').style.display = 'flex';
        document.getElementById('confirm-btn').style.display = 'block';
    }

    window.increaseQty = function(id) {
        const item = cart.find(i => i.id === id);
        if (item) item.quantity++;
        updateCartUI();
        renderCartItems();
    };

    window.decreaseQty = function(id) {
        const index = cart.findIndex(i => i.id === id);
        if (index > -1) { if (cart[index].quantity > 1) cart[index].quantity--; else cart.splice(index, 1); }
        updateCartUI();
        renderCartItems();
    };

    window.sendOrder = function() {
        const name = document.getElementById('customer-name').value.trim();
        const phone = document.getElementById('customer-phone').value.trim();
        const address = document.getElementById('customer-address').value.trim();
        if (!name || !phone || !address) { showToast('يرجى ملء جميع الحقول', 'error'); return; }
        const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
        let message = `🛒 *طلب جديد من ${restaurantName}*\n\n👤 *الاسم:* ${name}\n📱 *الهاتف:* ${phone}\n📍 *العنوان:* ${address}\n\n📋 *الأصناف:*\n━━━━━━━━━━━━━━━\n`;
        cart.forEach(item => { message += `▪️ ${item.quantity} × ${item.name} = ${(item.price * item.quantity).toLocaleString()} ل.س\n`; });
        message += `━━━━━━━━━━━━━━━\n💰 *الإجمالي:* ${totalPrice.toLocaleString()} ل.س\n`;
        if (deliveryShow === 'yes' && deliveryNote.trim() !== '') { message += `\n🚚 *ملاحظة:* ${deliveryNote}\n\n`; }
        message += `🙏 شكراً لطلبكم!`;
        window.open(`https://wa.me/${restaurantWhatsApp}?text=${encodeURIComponent(message)}`, '_blank');
        setTimeout(() => {
            cart = []; updateCartUI(); closeCart();
            document.getElementById('customer-name').value = '';
            document.getElementById('customer-phone').value = '';
            document.getElementById('customer-address').value = '';
            showToast('تم إرسال الطلب بنجاح');
        }, 1500);
    };

    document.getElementById('cart-modal').addEventListener('click', (e) => { if (e.target.id === 'cart-modal') closeCart(); });
    document.getElementById('item-modal').addEventListener('click', (e) => { if (e.target.id === 'item-modal') closeItemDetail(); });
</script>
</body>
</html>
