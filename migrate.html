<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ترحيل الصور إلى Cloudinary</title>
<style>
body { font-family: Arial; background: #121212; color: #fff; padding: 20px; }
h1 { color: #d4af37; }
button { background: #d4af37; color: #000; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; margin: 5px; }
button:disabled { background: #555; color: #999; cursor: not-allowed; }
input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font-size: 16px; width: 300px; }
#login-box { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
#main-box { display: none; }
#log { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 14px; line-height: 1.6; }
.ok { color: #4ade80; }
.err { color: #f87171; }
.info { color: #60a5fa; }
</style>
</head>
<body>
<h1>🔄 ترحيل الصور إلى Cloudinary</h1>

<div id="login-box">
    <h3>سجلي دخول أول</h3>
    <input type="password" id="pass" placeholder="كلمة سر الأدمن">
    <button onclick="doLogin()">🔓 دخول</button>
    <p id="login-msg" style="color:#f87171;"></p>
</div>

<div id="main-box">
    <p>هاد الملف رح يمر على كل الأصناف، يرفع صور Base64 على Cloudinary، ويستبدلها بروابط.</p>
    <p style="color: #f87171;">⚠️ لا تسكري الصفحة أثناء الترحيل.</p>
    <button id="btn" onclick="start()">🚀 ابدأ الترحيل</button>
    <div id="log"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAi_NnPfUwHPVQcmHMm9vKIYjbJWuzBqms",
    authDomain: "al-waleed-menu.firebaseapp.com",
    projectId: "al-waleed-menu",
    storageBucket: "al-waleed-menu.firebasestorage.app",
    messagingSenderId: "93044767292",
    appId: "1:93044767292:web:5f34dd396dd50c82bf6139"
};
const CLOUD_NAME = "lxejnqwn";
const UPLOAD_PRESET = "waleed";
const ADMIN_EMAIL = "admin@alwaleed.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function log(msg, cls = '') {
    const el = document.getElementById('log');
    if (!el) return;
    el.innerHTML += `<div class="${cls}">${msg}</div>`;
    el.scrollTop = el.scrollHeight;
}

window.doLogin = async function() {
    const pass = document.getElementById('pass').value;
    const msg = document.getElementById('login-msg');
    if (!pass) { msg.textContent = 'ادخلي كلمة السر'; return; }
    msg.textContent = '⏳ جاري تسجيل الدخول...';
    try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pass);
    } catch(e) {
        msg.textContent = '❌ كلمة السر غلط';
    }
};

document.getElementById('pass').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') window.doLogin();
});

onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('main-box').style.display = 'block';
    } else {
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('main-box').style.display = 'none';
    }
});

window.start = async function() {
    if (!auth.currentUser) { alert('سجلي دخول أول'); return; }
    document.getElementById('btn').disabled = true;
    log('📋 جاري قراءة الأصناف من Firestore...', 'info');
    
    try {
        const snap = await getDocs(collection(db, "menu"));
        log(`✅ عدد الأصناف: ${snap.size}`, 'ok');
        
        let success = 0, skipped = 0, failed = 0, total = snap.size, counter = 0;
        
        for (const docSnap of snap.docs) {
            counter++;
            const item = docSnap.data();
            const id = docSnap.id;
            
            if (!item.imageUrl || !item.imageUrl.startsWith('data:image')) {
                log(`⏭️ [${counter}/${total}] تخطي: ${item.name} (مو Base64)`, 'info');
                skipped++;
                continue;
            }
            
            try {
                log(`⏳ [${counter}/${total}] جاري رفع: ${item.name}...`);
                
                const res = await fetch(item.imageUrl);
                const blob = await res.blob();
                
                const formData = new FormData();
                formData.append('file', blob);
                formData.append('upload_preset', UPLOAD_PRESET);
                
                const up = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
                    { method: 'POST', body: formData }
                );
                const data = await up.json();
                
                if (!data.secure_url) {
                    throw new Error(data.error?.message || 'فشل الرفع - ' + JSON.stringify(data));
                }
                
                await updateDoc(doc(db, "menu", id), { imageUrl: data.secure_url });
                log(`✅ [${counter}/${total}] تم: ${item.name}`, 'ok');
                success++;
            } catch (err) {
                console.error(err);
                log(`❌ [${counter}/${total}] فشل: ${item.name} — ${err.message}`, 'err');
                failed++;
            }
        }
        
        log('');
        log('===================================', 'info');
        log(`🎉 خلص الترحيل!`, 'ok');
        log(`✅ نجح: ${success}`, 'ok');
        log(`⏭️ تخطي: ${skipped}`, 'info');
        log(`❌ فشل: ${failed}`, failed > 0 ? 'err' : 'info');
        log('===================================', 'info');
        log('');
        log('👉 روحي على الموقع وشوفي إذا الصور ظاهرة عادي.', 'info');
    } catch (err) {
        console.error(err);
        log(`❌ خطأ عام: ${err.message}`, 'err');
    }
};
</script>
</body>
</html>
