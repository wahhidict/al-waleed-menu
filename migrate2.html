<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نقل البيانات لوثيقة وحدة</title>
<style>
body { font-family: Arial; background: #121212; color: #fff; padding: 20px; }
h1 { color: #d4af37; }
button { background: #d4af37; color: #000; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; margin: 5px; }
button:disabled { background: #555; color: #999; cursor: not-allowed; }
input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font-size: 16px; width: 300px; }
#login-box { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
#main-box { display: none; }
#log { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 20px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 14px; line-height: 1.6; }
.ok { color: #4ade80; }
.err { color: #f87171; }
.info { color: #60a5fa; }
</style>
</head>
<body>
<h1>🔄 نقل الأصناف إلى وثيقة وحدة</h1>

<div id="login-box">
    <h3>سجلي دخول</h3>
    <input type="password" id="pass" placeholder="كلمة سر الأدمن">
    <button onclick="doLogin()">🔓 دخول</button>
    <p id="login-msg" style="color:#f87171;"></p>
</div>

<div id="main-box">
    <p style="color: #f87171;">⚠️ لا تسكري الصفحة أثناء النقل.</p>
    <button id="btn" onclick="start()">🚀 ابدأ النقل</button>
    <div id="log"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAi_NnPfUwHPVQcmHMm9vKIYjbJWuzBqms",
    authDomain: "al-waleed-menu.firebaseapp.com",
    projectId: "al-waleed-menu",
    storageBucket: "al-waleed-menu.firebasestorage.app",
    messagingSenderId: "93044767292",
    appId: "1:93044767292:web:5f34dd396dd50c82bf6139"
};
const ADMIN_EMAIL = "admin@alwaleed.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function log(msg, cls = '') {
    const el = document.getElementById('log');
    el.innerHTML += `<div class="${cls}">${msg}</div>`;
    el.scrollTop = el.scrollHeight;
}

window.doLogin = async function() {
    const pass = document.getElementById('pass').value;
    const msg = document.getElementById('login-msg');
    if (!pass) { msg.textContent = 'ادخلي كلمة السر'; return; }
    msg.textContent = '⏳ جاري الدخول...';
    try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pass);
    } catch(e) {
        msg.textContent = '❌ كلمة السر غلط';
    }
};

document.getElementById('pass').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') window.doLogin();
});

onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('main-box').style.display = 'block';
    } else {
        document.getElementById('login-box').style.display = 'block';
        document.getElementById('main-box').style.display = 'none';
    }
});

window.start = async function() {
    if (!auth.currentUser) { alert('سجلي دخول أول'); return; }
    document.getElementById('btn').disabled = true;
    log('📋 جاري قراءة الأصناف...', 'info');
    
    try {
        // قراءة كل الأصناف
        const snap = await getDocs(collection(db, "menu"));
        log(`✅ عدد الوثائق: ${snap.size}`, 'ok');
        
        // بناء المصفوفة (نتجاهل وثيقة "all" إذا كانت موجودة)
        const items = [];
        snap.forEach(docSnap => {
            if (docSnap.id === 'all') {
                log(`⏭️ تخطي وثيقة "all"`, 'info');
                return;
            }
            const data = docSnap.data();
            items.push({
                id: docSnap.id,
                category: data.category || '',
                name: data.name || '',
                price: data.price || 0,
                description: data.description || '',
                imageUrl: data.imageUrl || '',
                createdAt: data.createdAt || new Date()
            });
        });
        
        log(`📦 عدد الأصناف: ${items.length}`, 'ok');
        
        // كتابة الوثيقة الوحدة
        log('💾 جاري الحفظ...', 'info');
        await setDoc(doc(db, "menu", "all"), {
            items: items,
            updatedAt: new Date(),
            migratedAt: new Date(),
            version: 1
        });
        
        log('✅ تم الحفظ!', 'ok');
        
        // التحقق
        log('🔍 جاري التحقق...', 'info');
        const verify = await getDoc(doc(db, "menu", "all"));
        if (verify.exists() && verify.data().items.length === items.length) {
            log(`🎉 نجح! ${items.length} صنف محفوظين بوثيقة وحدة.`, 'ok');
            log('👉 هلأ بدلي admin.html و index.html بالنسخ الجديدة.', 'info');
        } else {
            log(`⚠️ تحذير: عدد الأصناف ما يطابق`, 'err');
        }
        
        document.getElementById('btn').disabled = false;
    } catch (err) {
        console.error(err);
        log(`❌ خطأ: ${err.message}`, 'err');
        document.getElementById('btn').disabled = false;
    }
};
</script>
</body>
</html>
