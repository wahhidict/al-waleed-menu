<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>Test Cloud Name</title></head>
<body style="background:#111;color:#fff;padding:20px;font-family:monospace;">
<h2>اختبار اسم الحساب</h2>
<input type="file" id="f" accept="image/*" style="margin:10px 0;">
<br>
<button onclick="test('lxjejnqwn')" style="padding:10px;margin:5px;">اختبار lxjejnqwn</button>
<button onclick="test('lxejnqwn')" style="padding:10px;margin:5px;">اختبار lxejnqwn</button>
<pre id="out" style="background:#222;padding:15px;margin-top:20px;white-space:pre-wrap;direction:ltr;text-align:left;"></pre>
<script>
async function test(cloud) {
  const f = document.getElementById('f').files[0];
  const out = document.getElementById('out');
  if (!f) { out.textContent = 'اختاري صورة أول'; return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('upload_preset', 'waleed');
  out.textContent = '⏳ بجرب: ' + cloud + ' ...';
  try {
    const r = await fetch('https://api.cloudinary.com/v1_1/' + cloud + '/image/upload', { method:'POST', body:fd });
    const d = await r.json();
    out.textContent = 'Cloud: ' + cloud + '\nHTTP: ' + r.status + '\n\n' + JSON.stringify(d, null, 2);
  } catch(e) {
    out.textContent = 'Cloud: ' + cloud + '\n❌ ' + e.message;
  }
}
</script>
</body>
</html>
